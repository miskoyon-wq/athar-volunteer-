# ─────────────────────────────────────────────────────────────────────────────
#  إعداد مهم جدًا لـ GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
#  هذا الملف يُخبر GitHub ألا يعالج الموقع بمحرّك Jekyll إطلاقًا،
#  لأن الموقع ثابت (static) جاهز ولا يحتاج أي معالجة.
#
#  الاثنان معًا يضمنان عدم فقدان أو تعديل أي ملف:
#    1) ملف  .nojekyll   (يمنع Jekyll)
#    2) هذا الملف        (تأكيد إضافي + ضمان عدم توليد صفحات من ملفات md)
# ─────────────────────────────────────────────────────────────────────────────

# ألغِ توليد الموقع من محرّك Jekyll
theme: null

# استثنِ ملفات المشروع المساعدة من النشر
exclude:
  - serve.sh
  - deploy.sh
  - "*.md"
  - "*.zip"
  - "*.bundle"
  - GITHUB-PAGES-GUIDE.pdf
  - GITHUB-PAGES-GUIDE.html
  - CNAME.example
  - apk/README.txt
